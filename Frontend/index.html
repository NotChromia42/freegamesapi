<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogos gratuitos</title>
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
</head>
<body>
    <header>
        <h1>Jogos gratuitos</h1>
        <p>Encontre seu próximo jogo.</p>
    </header>

    <main>
        <label for="pesquisa">Pesquisar por nome</label>
        <input
            type="search"
            id="pesquisa"
            placeholder="Digite o nome de um jogo"
        >

        <p id="mensagem" role="status"></p>
        <!-- cards pro js -->
        <section id="jogos" aria-label="Lista de jogos"></section>
    </main>
</body>
</html>
