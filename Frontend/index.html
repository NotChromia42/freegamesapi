<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogos gratuitos</title>
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
</head>
<body>
    <header>
        <h1>Jogos gratuitos</h1>
        <p>Encontre seu próximo jogo.</p>
    </header>

    <main>
    <!-- Organiza a pesquisa e o filtro lado a lado -->
    <div class="filtros">
        <div class="campo-pesquisa">
            <label for="pesquisa">Pesquisar por nome</label>
            <input
                type="search"
                id="pesquisa"
                placeholder="Digite o nome de um jogo"
            >
        </div>

        <div class="campo-genero">
            <label for="genero">Filtrar por gênero</label>
            <select id="genero">
                <option value="">Todos os gêneros</option>
            </select>
        </div>
    </div>

    <div id="mensagem">Carregando jogos...</div>
    <div id="jogos" class="lista-jogos">
        <!-- Os cards dos jogos serão inseridos aqui pelo JavaScript -->
    </div>
    </main>
</body>
</html>
